services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-backend
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_DOMAIN:-localhost}/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    external: false
